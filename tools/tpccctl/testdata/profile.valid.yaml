apiVersion: portable-tpcc/v1
kind: TpccRunProfile

metadata:
  name: test-profile

mode: engineering

spec:
  edition: tpc-c-5.11.0

deviations:
  - code: fixed_generator_seed
    reason: test fixture

ssh:
  user: tpcc
  use_agent: false
  known_hosts: ~/.ssh/known_hosts
  connect_timeout: 10s

hosts:
  control:
    address: 127.0.0.1
  load-a:
    address: 127.0.0.1
  worker-a:
    address: 127.0.0.1

paths:
  local_artifacts: ./dist
  remote_root: ./remote
  result_root: ./results
  state_dir: ./state

database:
  dbms: pgsql
  endpoint: localhost:5432
  database: tpcc
  path: portable_tpcc
  password_env: TPCC_PASSWORD
  options:
    tx_mode: serializable

scale:
  warehouses: 10

data:
  seed: 42
  batch_rows: 1000

loaders:
  - name: loader-a
    host: load-a

workers:
  - name: worker-a
    host: worker-a

phases:
  start_lead: 45s
  ramp_up: 5m
  measurement: 30m
  transaction_drain: 30s
  stop_grace: 15s
  max_clock_skew_ms: 100
  max_clock_uncertainty_ms: 25
  max_clock_drift_ms: 25

runtime:
  pacing: enabled
  threads_per_worker: 2
  max_inflight_per_worker: 64
  retry:
    max_attempts: 4
    initial_backoff: 10ms
    max_backoff: 500ms
    jitter: full
  histogram:
    unit: us
    lowest: 1
    highest: 120000000
    significant_figures: 3

checks:
  after_import: true
  after_run: true
  fail_fast: true

collect:
  include_events: true
  include_logs: true
