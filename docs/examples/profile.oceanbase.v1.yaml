apiVersion: portable-tpcc/v1
kind: TpccRunProfile

metadata:
  name: lab-oceanbase-10

ssh:
  user: tpcc
  use_agent: false
  known_hosts: ~/.ssh/known_hosts
  connect_timeout: 10s

# Single-host lab: every address may be 127.0.0.1 (local sessions, no SSH).
# Multi-host runs need SSH access and tightly synchronized clocks.
hosts:
  control:
    address: 127.0.0.1
  load-a:
    address: 127.0.0.1
  load-b:
    address: 127.0.0.1
  worker-a:
    address: 127.0.0.1
  worker-b:
    address: 127.0.0.1

paths:
  local_artifacts: ./dist
  remote_root: ./remote
  result_root: ./results
  state_dir: ./state

database:
  dbms: oceanbase
  # MySQL-compatible SQL port (default 2881 if omitted).
  endpoint: 127.0.0.1:2881
  # Connection database=… value (tenant-local database name).
  database: tpcc
  # Effective database for TPC-C tables; CREATE DATABASE IF NOT EXISTS is used.
  path: tpcc
  # Password is read from this environment variable (never put secrets in YAML).
  password_env: TPCC_PASSWORD
  # database.user is YDB-only. OceanBase user defaults to root@test, or
  # TPCC_OB_USER when that env var is set.
  options:
    # Hash partitions via tablegroup: -1 = off, 0 = derive from scale.warehouses,
    # N = explicit count (max 8192).
    partitions: 0
    # Omit FOREIGN KEY constraints at schema time when off (default on).
    foreign_keys: off

scale:
  warehouses: 10

data:
  seed: 42
  batch_rows: 1000

workload:
  transaction_mix:
    new_order: 45
    payment: 43
    order_status: 4
    delivery: 4
    stock_level: 4

# Multiple loaders/workers: mind assigns balanced contiguous warehouse ranges.
# Add more entries (and matching hosts.*) to scale out runners.
loaders:
  - name: loader-a
    host: load-a
  - name: loader-b
    host: load-b

workers:
  - name: worker-a
    host: worker-a
  - name: worker-b
    host: worker-b

checks:
  after_import: true
  after_run: true

phases:
  start_lead: 45s
  ramp_up: 1m
  measurement: 5m
  transaction_drain: 30s
  stop_grace: 15s
  max_clock_skew_ms: 100

runtime:
  pacing: enabled
  think_time_distribution: exponential
  threads_per_worker: 4
  max_inflight_per_worker: 64
  retry:
    max_attempts: 4
    initial_backoff: 10ms
    max_backoff: 500ms
    jitter: full
