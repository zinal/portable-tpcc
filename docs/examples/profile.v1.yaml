apiVersion: portable-tpcc/v1
kind: TpccRunProfile

metadata:
  name: lab-ydb-200

mode: engineering

spec:
  edition: tpc-c-5.11.0

deviations:
  - code: fixed_generator_seed
    reason: repeatable cross-DB engineering comparison

ssh:
  user: tpcc
  use_agent: true
  known_hosts: ~/.ssh/known_hosts
  connect_timeout: 10s

hosts:
  control:
    address: 10.10.0.10
  load-a:
    address: 10.10.0.21
  load-b:
    address: 10.10.0.22
  worker-a:
    address: 10.10.0.31
  worker-b:
    address: 10.10.0.32

paths:
  local_artifacts: ./dist
  remote_root: /opt/portable-tpcc
  result_root: ./results
  state_dir: ~/.local/state/tpccctl

database:
  dbms: ydb
  endpoint: grpcs://ydb.example.net:2135
  database: /Root/tpcc
  path: portable_tpcc
  password_env: YDB_TOKEN
  options:
    tx_mode: serializable-rw
    compact_after_load: true

scale:
  warehouses: 200

data:
  # Явный seed разрешён только в engineering.
  seed: 731910246
  batch_rows: 10000

loaders:
  - name: loader-a
    host: load-a
  - name: loader-b
    host: load-b

workers:
  - name: worker-a
    host: worker-a
  - name: worker-b
    host: worker-b

phases:
  start_lead: 45s
  ramp_up: 5m
  measurement: 30m
  transaction_drain: 30s
  stop_grace: 15s
  max_clock_skew_ms: 100
  max_clock_uncertainty_ms: 25
  max_clock_drift_ms: 25

runtime:
  pacing: enabled
  threads_per_worker: 4
  max_inflight_per_worker: 256
  retry:
    max_attempts: 4
    initial_backoff: 10ms
    max_backoff: 500ms
    jitter: full
  histogram:
    unit: us
    lowest: 1
    highest: 120000000
    significant_figures: 3

checks:
  after_import: true
  after_run: true
  fail_fast: true

collect:
  include_events: true
  include_logs: true
