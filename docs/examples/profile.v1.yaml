apiVersion: portable-tpcc/v1
kind: TpccRunProfile

metadata:
  name: lab-ydb-200

ssh:
  user: tpcc
  use_agent: true
  known_hosts: ~/.ssh/known_hosts
  connect_timeout: 10s

hosts:
  control:
    address: 10.10.0.10
  load-a:
    address: 10.10.0.21
  load-b:
    address: 10.10.0.22
  worker-a:
    address: 10.10.0.31
  worker-b:
    address: 10.10.0.32

paths:
  local_artifacts: ./dist
  remote_root: /home/user/portable-tpcc
  result_root: ./results
  state_dir: ~/.local/state/tpccctl

database:
  dbms: ydb
  endpoint: grpcs://ydb.example.net:2135
  database: /Root/tpcc
  path: portable_tpcc
  password_env: YDB_PASSWORD
  options:
    tx_mode: serializable-rw
    compact_after_load: true

scale:
  warehouses: 200

data:
  # Explicit seed for repeatable cross-DBMS engineering comparison.
  seed: 731910246
  batch_rows: 10000

# Omitted workload fields use defaults embedded in tpccctl.
workload:
  transaction_mix:
    new_order: 45
    payment: 43
    order_status: 4
    delivery: 4
    stock_level: 4

loaders:
  - name: loader-a
    host: load-a
  - name: loader-b
    host: load-b

workers:
  - name: worker-a
    host: worker-a
  - name: worker-b
    host: worker-b

phases:
  # Launch + prepare budget before absolute --start-at (orchestrator chooses
  # start-at = now + start_lead). Hosts must keep clocks tightly synced.
  start_lead: 45s
  ramp_up: 5m
  measurement: 30m
  transaction_drain: 30s
  stop_grace: 15s
  max_clock_skew_ms: 100

runtime:
  pacing: enabled
  # exponential (default): TPC-C §5.2.5.4. Use compatibility for constant mean think time.
  think_time_distribution: exponential
  threads_per_worker: 4
  max_inflight_per_worker: 256
  retry:
    max_attempts: 4
    initial_backoff: 10ms
    max_backoff: 500ms
    jitter: full
    retry_ambiguous_commit: false
