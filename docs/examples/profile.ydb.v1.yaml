apiVersion: portable-tpcc/v1
kind: TpccRunProfile

metadata:
  name: lab-ydb-200

ssh:
  user: tpcc
  use_agent: true
  known_hosts: ~/.ssh/known_hosts
  connect_timeout: 10s

paths:
  local_artifacts: ./dist
  remote_root: /home/user/portable-tpcc
  result_root: ./results
  state_dir: ~/.local/state/mind-tpcc

database:
  dbms: ydb
  endpoint: grpcs://ydb.example.net:2135
  database: /Root/tpcc
  path: portable_tpcc
  # Auth: anonymous | login | sa_key
  auth_scheme: login
  user: root
  password_env: YDB_PASSWORD
  # Optional TLS trust anchors (delivered to workers as ca.pem):
  # ca_file: ./certs/ydb-ca.pem
  # For service-account auth instead of login:
  # auth_scheme: sa_key
  # sa_key_file: ./secrets/sa-key.json

scale:
  warehouses: 200

data:
  # Explicit seed for repeatable cross-DBMS engineering comparison.
  seed: 731910246
  batch_rows: 10000

# Omitted workload fields use defaults embedded in mind-tpcc.
workload:
  transaction_mix:
    new_order: 45
    payment: 43
    order_status: 4
    delivery: 4
    stock_level: 4

# host is the connection address. Identical host values mean co-location
# (one SSH/local session shared by those instances).
loaders:
  - name: loader-a
    host: 10.10.0.21
  - name: loader-b
    host: 10.10.0.22

workers:
  - name: worker-a
    host: 10.10.0.31
  - name: worker-b
    host: 10.10.0.32

phases:
  # Launch + prepare budget before absolute --start-at (orchestrator chooses
  # start-at = now + start_lead). Hosts must keep clocks tightly synced.
  start_lead: 45s
  ramp_up: 5m
  measurement: 30m
  transaction_drain: 30s
  stop_grace: 15s
  max_clock_skew_ms: 100

runtime:
  pacing: enabled
  # exponential (default): TPC-C §5.2.5.4. Use compatibility for constant mean think time.
  think_time_distribution: exponential
  # 0 / omitted = auto (min of assigned warehouses, host CPUs, adapter max)
  threads_per_loader: 0
  threads_per_worker: 4
  # 0 / omitted = auto (min of scale.warehouses and 32)
  check_concurrency: 0
  max_inflight_per_worker: 256
  retry:
    max_attempts: 4
    initial_backoff: 10ms
    max_backoff: 500ms
    jitter: full
