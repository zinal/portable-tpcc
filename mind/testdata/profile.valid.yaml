apiVersion: portable-tpcc/v1
kind: TpccRunProfile

metadata:
  name: test-profile

ssh:
  user: tpcc
  use_agent: false
  known_hosts: ~/.ssh/known_hosts
  connect_timeout: 10s

paths:
  local_artifacts: ./dist
  remote_root: ./remote
  result_root: ./results
  state_dir: ./state

database:
  dbms: pgsql
  endpoint: localhost:5432
  database: tpcc
  path: portable_tpcc
  password_env: TPCC_PASSWORD
  options: {}

scale:
  warehouses: 10

data:
  seed: 42
  batch_rows: 1000

workload:
  transaction_mix:
    new_order: 45
    payment: 43
    order_status: 4
    delivery: 4
    stock_level: 4

loaders:
  - name: loader-a
    host: 127.0.0.1

workers:
  - name: worker-a
    host: 127.0.0.1

phases:
  start_lead: 45s
  ramp_up: 5m
  measurement: 30m
  transaction_drain: 30s
  stop_grace: 15s
  max_clock_skew_ms: 100

runtime:
  pacing: enabled
  threads_per_worker: 2
  max_inflight_per_worker: 64
  retry:
    max_attempts: 4
    initial_backoff: 10ms
    max_backoff: 500ms
    jitter: full
